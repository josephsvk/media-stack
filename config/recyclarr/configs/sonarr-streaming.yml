# yaml-language-server: $schema=https://raw.githubusercontent.com/recyclarr/recyclarr/master/schemas/config-schema.json
sonarr:
  streaming-1080-2160p:
    base_url: http://sonarr:8989
    api_key: 03ffa11480ea4881a70d535914752c21

    quality_definition:
      type: series
      preferred_ratio: 0.1

    replace_existing_custom_formats: true

    quality_profiles:
      - name: "1080-2160p Streaming Optimized"
        reset_unmatched_scores:
          enabled: true
        upgrade:
          allowed: true
          until_quality: WEBDL-2160p
        quality_sort: top
        qualities:
          - name: WEBDL-2160p
          - name: WEBRip-2160p
          - name: WEBDL-1080p
          - name: WEBRip-1080p
          - name: Bluray-1080p
          - name: HDTV-1080p
          - name: WEBDL-720p        
          - name: WEBRip-720p       
          - name: Bluray-720p       
          - name: HDTV-720p         

    custom_formats:
    # 1) WEB Tier 01 – Najvyššia priorita pre rýchle streamingové releasy (napr. WEBDL-2160p s najlepším audio kvalifikátorom)
    - trash_ids:
        - e6258996055b9fbab7e9cb2f75819294  # WEB Tier 01
      assign_scores_to:
        - name: "1080-2160p Streaming Optimized"
          score: 2000  # Najvyššie skóre, zaručuje, že sa tieto releasy vždy vyberú pred ostatnými

    # 2) WEB Tier 02 – Druhá najvyššia priorita pre streaming (mierne nižšia kvalita/rýchlosť než Tier 01)
    - trash_ids:
        - 58790d4e2fdcd9733aa7ae68ba2bb503  # WEB Tier 02
      assign_scores_to:
        - name: "1080-2160p Streaming Optimized"
          score: 1700  # Niečo nižšie než Tier 01, ale stále privilegované

    # 3) WEB Tier 03 – Tretia najvyššia priorita pre streaming (ľahko znižuje kvalitu/rýchlosť)
    - trash_ids:
        - d84935abd3f8556dcd51d4f27e22d0a6  # WEB Tier 03
      assign_scores_to:
        - name: "1080-2160p Streaming Optimized"
          score: 1400  # Vhodné, ak Tier 01/02 nie sú dostupné

    # 4) HEVC / x265 HD – Moderný, efektívny codec s dobrou kvalitou pri menšom filesize
    - trash_ids:
        - c9eafd50846d299b862ca9bb6ea91950  # x265
      assign_scores_to:
        - name: "1080-2160p Streaming Optimized"
          score: 1000  # Preferencia pre tých, čo chcú HEVC napriek limitovanej rýchlosti

    # 5) Blu-Ray / Remux / UHD – Najvyššia kvalita disku, no väčšie súbory a pomalšie sťahovanie
    - trash_ids:
        - d6819cba26b1a6508138d25fb5e32293  # HD Bluray Tier 01
        - c2216b7b8aa545dc1ce8388c618f8d57  # HD Bluray Tier 02
        - 9965a052eb87b0d10313b1cea89eb451  # Remux Tier 01
        - 8a1d0c3d7497e741736761a1da866a2e  # Remux Tier 02
        - 1bef6c151fa35093015b0bfef18279e5  # 2160p (UHD)
      assign_scores_to:
        - name: "1080-2160p Streaming Optimized"
          score: 800  # Vysoká kvalita, ale menej preferované než rýchle WEB releasy

    # 6) Štandardné audio formáty – pre prípady, kde nie sú lepšie verzie
    - trash_ids:
        - 5964f2a8b3be407d083498e4459d05d0  # DTS
        - a50b8a0c62274a7c38b09a9619ba9d86  # AAC
        - dbe00161b08a25ac6154c55f95e6318d  # DD (AC3)
      assign_scores_to:
        - name: "1080-2160p Streaming Optimized"
          score: 400  # Ak nie sú dostupné lepšie zdroje, tieto budú vybrané

    # 7) Záložka (prázdny) – Umožní vybrať akýkoľvek iný zdroj, ak neexistuje nič iné
    - trash_ids: []  # Nešpecifikuje žiadne ID – označí všetky ostatné releasy
      assign_scores_to:
        - name: "1080-2160p Streaming Optimized"
          score: 50   # Minimálne skóre, zaručí aspoň nejaký download

    # 8) Mierne potlačené formáty (HDR, remastery, špeciál editions) – Menej preferované kvôli možným problémom s prehrávaním alebo zmene kvality
    - trash_ids:
        - 6d0d8de7b57e35518ac0308b0ddf404e  # DV
        - 7878c33f1963fefb3d6c8657d46c2f0a  # DV HDR10
        - 2b239ed870daba8126a53bd5dc8dc1c8  # DV HDR10+
        - 1f733af03141f068a540eec352589a89  # DV HLG
        - 27954b0a80aab882522a88a4d9eae1cd  # DV SDR
        - 3e2c4e748b64a1a1118e0ea3f4cf6875  # HDR
        - bb019e1cd00f304f80971c965de064dc  # HDR (undefined)
        - 3497799d29a085e2ac2df9d468413c94  # HDR10
        - a3d82cbef5039f8d295478d28a887159  # HDR10+
        - 17e889ce13117940092308f48b48b45b  # HLG
      assign_scores_to:
        - name: "1080-2160p Streaming Optimized"
          score: -200  # Mierne záporné, bude vybrané len ak nie je nič iné

    # 9) Veľmi potlačené / nechcené (3D, LQ, neangličtina, extras, upscaley) – Tieto tagy chceme úplne vylúčiť
    - trash_ids:
        - 15a05bc7c1a36e2b57fd628f8977e2fc  # AV1
        - 23297a736ca77c0fc8e70f8edd7ee56c  # Upscaled
        - 9c11cd3f07101cdba90a2d81cf0e56b4  # LQ
        - e1a997ddb54e3ecbfe06341ad323c458  # Obfuscated
        - fbcb31d8dabd2a319072b84fc0b7249c  # Extras
      assign_scores_to:
        - name: "1080-2160p Streaming Optimized"
          score: -1000  # Veľmi negatívne, takmer nikdy sa nevyberie

    # 10) SK/CZ verzie (Language: Not English) – Najvyššia priorita, aby vždy mali slovenské/české titulky
    - trash_ids:
        - 69aa1e159f97d860440b04cd6d590c4f  # Language: Not English (SK/CZ verzie)
      assign_scores_to:
        - name: "1080-2160p Streaming Optimized"
          score: 2100  # Prekoná všetky ostatné anglické releasy

    # 11) Štandardné 720p releasy – nižšia priorita, ale použiteľné
    - trash_ids:
        - c99279ee27a154c2f20d1d505cc99e25  # 720p
      assign_scores_to:
        - name: "1080-2160p Streaming Optimized"
          score: 250  # Menej než 1080p, ale použiteľné ak nič iné
